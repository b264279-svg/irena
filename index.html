<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#10162e"><title>Neon Ward | 2D Mini Game</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><main class="game-shell"><header class="game-header"><div><p class="eyebrow">SURVIVAL PROTOCOL</p><h1>NEON WARD</h1></div><p class="objective">迫りくる侵入者を撃退せよ</p></header>
<section class="hud" aria-label="ゲーム情報"><div class="hud-card hp-card"><div class="hud-label"><span>PLAYER HP</span><strong id="hpText">100 / 100</strong></div><div class="bar-track"><div class="bar-fill" id="hpBar"></div></div></div><div class="hud-card score-card"><span class="hud-label">SCORE</span><strong id="scoreText">0000</strong></div><div class="hud-card wave-card"><span class="hud-label">WAVE</span><strong id="waveText">01</strong></div></section>
<section class="stage-wrap" aria-label="ゲーム画面"><canvas id="gameCanvas" width="960" height="540" aria-label="Neon Ward game canvas"></canvas><div class="scanlines" aria-hidden="true"></div><div class="start-panel" id="startPanel"><p class="panel-kicker">SYSTEM ONLINE</p><h2>守りを固めろ。</h2><p>アリーナに侵入する敵を、ブラスターで排除しよう。</p><button id="startButton" type="button">ゲームを開始</button></div><div class="game-over-panel is-hidden" id="gameOverPanel" aria-live="polite"><p class="panel-kicker">MISSION FAILED</p><h2>GAME OVER</h2><p>最終スコア <strong id="finalScore">0000</strong></p><button id="restartButton" type="button">もう一度プレイ</button></div></section>
<section class="instructions" aria-label="操作方法"><div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>移動</span></div><div><kbd>SPACE</kbd><span>攻撃</span></div><p>敵に近づかれすぎないよう注意！</p></section></main><script src="game.js"></script></body></html>
